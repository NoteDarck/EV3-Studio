  ['amarelo','YELLOW'],['vermelho','RED'],['branco','WHITE']
];

function dropdown(options){return new Blockly.FieldDropdown(options)}

function statement(block,colour){
  block.setPreviousStatement(true);
  block.setNextStatement(true);
  block.setColour(colour);
}

function valueBlock(block,output,colour){
  block.setOutput(true,output);
  block.setColour(colour);
}

function eventBlock(name,label,inputs){
  Blockly.Blocks[name]={
    init(){
      this.appendDummyInput().appendField(label);
      for(const x of inputs)this.appendDummyInput().appendField(x[0]).appendField(x[1]);
      this.appendStatementInput("DO").appendField("faça");
      this.setColour("#e91e63");
    }
  };
}

eventBlock("ev3_event_touch","QUANDO TOCAR",[
  ["porta",dropdown(sensorPorts)]
]);

eventBlock("ev3_event_color","QUANDO COR FOR",[
  ["cor",dropdown(colors)],["porta",dropdown(sensorPorts)]
]);

eventBlock("ev3_event_distance","QUANDO DISTÂNCIA FOR MENOR QUE",[
  ["cm",new Blockly.FieldNumber(20,0,255,1)],
  ["porta",dropdown(sensorPorts)]
]);

eventBlock("ev3_event_gyro","QUANDO ÂNGULO FOR",[
  ["graus",new Blockly.FieldNumber(90,-36000,36000,1)],
  ["porta",dropdown(sensorPorts)]
]);

eventBlock("ev3_event_button","QUANDO BOTÃO FOR PRESSIONADO",[
  ["botão",dropdown([
    ["centro","CENTER"],["cima","UP"],["baixo","DOWN"],
    ["esquerda","LEFT"],["direita","RIGHT"],["voltar","BACK"]
  ])]
]);

eventBlock("ev3_event_timer","QUANDO TIMER ATINGIR",[
  ["segundos",new Blockly.FieldNumber(5,0,3600,1)]
]);

eventBlock("ev3_event_message","QUANDO RECEBER MENSAGEM",[
  ["mensagem",new Blockly.FieldTextInput("iniciar")]
]);

/* =========================================================
   GERADOR PYTHON
   ========================================================= */

const py=Blockly.Python;

py.forBlock.ev3_start=b=>py.statementToCode(b,"DO");

py.forBlock.ev3_motor_time=b=>
  `motor_${b.getFieldValue("PORT").toLowerCase()}.run_time(${Number(b.getFieldValue("SPEED"))*10}, ${Math.round(Number(b.getFieldValue("SECONDS"))*1000)})\n`;

py.forBlock.ev3_motor_angle=b=>
  `motor_${b.getFieldValue("PORT").toLowerCase()}.run_angle(${Number(b.getFieldValue("SPEED"))*10}, ${Number(b.getFieldValue("ANGLE"))})\n`;

py.forBlock.ev3_motor_forever=b=>
  `motor_${b.getFieldValue("PORT").toLowerCase()}.run(${Number(b.getFieldValue("SPEED"))*10})\n`;

py.forBlock.ev3_motor_speed=b=>
  `motor_${b.getFieldValue("PORT").toLowerCase()}.run(${Number(b.getFieldValue("SPEED"))*10})\n`;

py.forBlock.ev3_motor_stop=b=>{
  const p=b.getFieldValue("PORT"),s=b.getFieldValue("STOP");
  const fn=s==="COAST"?"stop":s==="BRAKE"?"brake":"hold";
  if(p==="ALL")
    return `for _motor in motors.values():\n    _motor.${fn}()\n`;
  return `motor_${p.toLowerCase()}.${fn}()\n`;
};

py.forBlock.ev3_motor_reset=b=>
  `motor_${b.getFieldValue("PORT").toLowerCase()}.reset_angle(${Number(b.getFieldValue("ANGLE"))})\n`;

py.forBlock.ev3_motor_get_angle=b=>
  [`motor_${b.getFieldValue("PORT").toLowerCase()}.angle()`,py.ORDER_ATOMIC];

py.forBlock.ev3_motor_get_speed=b=>
  [`motor_${b.getFieldValue("PORT").toLowerCase()}.speed()`,py.ORDER_ATOMIC];

py.forBlock.ev3_motor_get_load=b=>
  [`motor_${b.getFieldValue("PORT").toLowerCase()}.load()`,py.ORDER_ATOMIC];

py.forBlock.ev3_motor_hold=b=>
  `motor_${b.getFieldValue("PORT").toLowerCase()}.hold()\n`;

py.forBlock.ev3_drive_distance=b=>{
  const l=b.getFieldValue("LEFT").toLowerCase();
  const r=b.getFieldValue("RIGHT").toLowerCase();
  const d=Number(b.getFieldValue("DIST"));
  return `motor_${l}.run_angle(500, ${d})\nmotor_${r}.run_angle(500, ${d})\n`;
};

py.forBlock.ev3_drive_turn=b=>{
  const l=b.getFieldValue("LEFT").toLowerCase();
  const r=b.getFieldValue("RIGHT").toLowerCase();
  const a=Number(b.getFieldValue("ANGLE"));
  return `motor_${l}.run_angle(500, ${a})\nmotor_${r}.run_angle(-500, ${a})\n`;
};

py.forBlock.ev3_drive_start=b=>
  `drive_left.run(${Number(b.getFieldValue("SPEED"))*10})\ndrive_right.run(${Number(b.getFieldValue("SPEED"))*10})\n`;

py.forBlock.ev3_drive_stop=b=>
  `drive_left.stop()\ndrive_right.stop()\n`;

py.forBlock.ev3_drive_arc=b=>
  `# Curva: velocidade ${b.getFieldValue("SPEED")}% / curva ${b.getFieldValue("TURN")}%\n`+
  `drive_left.run(${Number(b.getFieldValue("SPEED"))*10})\n`+
  `drive_right.run(${Number(b.getFieldValue("SPEED"))*10})\n`+
  `wait(${Math.round(Number(b.getFieldValue("SECONDS"))*1000)})\n`+
  `drive_left.stop()\ndrive_right.stop()\n`;

py.forBlock.ev3_screen_text=b=>
  `ev3.screen.draw_text(${b.getFieldValue("X")}, ${b.getFieldValue("Y")}, ${JSON.stringify(b.getFieldValue("TEXT"))})\n`;

py.forBlock.ev3_screen_number=b=>
  `ev3.screen.draw_text(${b.getFieldValue("X")}, ${b.getFieldValue("Y")}, str(${py.valueToCode(b,"VALUE",py.ORDER_NONE)||"0"}))\n`;

py.forBlock.ev3_screen_line=b=>
  `ev3.screen.draw_line(${b.getFieldValue("X1")}, ${b.getFieldValue("Y1")}, ${b.getFieldValue("X2")}, ${b.getFieldValue("Y2")})\n`;

py.forBlock.ev3_screen_rect=b=>
  `ev3.screen.draw_box(${b.getFieldValue("X")}, ${b.getFieldValue("Y")}, ${b.getFieldValue("W")}, ${b.getFieldValue("H")})\n`;

py.forBlock.ev3_screen_circle=b=>
  `ev3.screen.draw_circle(${b.getFieldValue("X")}, ${b.getFieldValue("Y")}, ${b.getFieldValue("R")})\n`;

py.forBlock.ev3_screen_clear=b=>
  `ev3.screen.clear()\n`;

py.forBlock.ev3_screen_image=b=>
  `ev3.screen.load_image_file(${JSON.stringify(b.getFieldValue("FILE"))})\n`;

py.forBlock.ev3_beep=b=>
  `ev3.speaker.beep(${Number(b.getFieldValue("FREQ"))}, ${Math.round(Number(b.getFieldValue("SECONDS"))*1000)})\n`;

py.forBlock.ev3_note=b=>
  `ev3.speaker.beep(${Number(b.getFieldValue("FREQ"))}, ${Number(b.getFieldValue("MS"))})\n`;

py.forBlock.ev3_sound_file=b=>
  `ev3.speaker.file(${JSON.stringify(b.getFieldValue("FILE"))})\n`;

py.forBlock.ev3_sound_stop=b=>
  `ev3.speaker.stop()\n`;

py.forBlock.ev3_speak=b=>
  `ev3.speaker.say(${JSON.stringify(b.getFieldValue("TEXT"))})\n`;

py.forBlock.ev3_volume=b=>
  `ev3.speaker.set_volume(${Number(b.getFieldValue("VOL"))})\n`;

py.forBlock.ev3_wait=b=>
  `wait(${Math.round(Number(b.getFieldValue("SECONDS"))*1000)})\n`;

py.forBlock.ev3_repeat=b=>
  `for _ in range(${Number(b.getFieldValue("TIMES"))}):\n${py.statementToCode(b,"DO")||"    pass\n"}`;

py.forBlock.ev3_forever=b=>
  `while True:\n${py.statementToCode(b,"DO")||"    pass\n"}`;

py.forBlock.ev3_wait_until=b=>
  `while not (${py.valueToCode(b,"COND",py.ORDER_NONE)||"False"}):\n    wait(10)\n`;

py.forBlock.ev3_stop_script=b=>`raise SystemExit\n`;

py.forBlock.ev3_touch_value=b=>
  [`touch_${b.getFieldValue("PORT")}.pressed()`,py.ORDER_ATOMIC];

py.forBlock.ev3_color_value=b=>
  [`str(color_sensor_${b.getFieldValue("PORT")}.color())`,py.ORDER_ATOMIC];

py.forBlock.ev3_reflected_value=b=>
  [`color_sensor_${b.getFieldValue("PORT")}.reflection()`,py.ORDER_ATOMIC];

py.forBlock.ev3_ambient_value=b=>
  [`color_sensor_${b.getFieldValue("PORT")}.ambient()`,py.ORDER_ATOMIC];

py.forBlock.ev3_ultrasonic_value=b=>
  [`ultrasonic_${b.getFieldValue("PORT")}.distance()`,py.ORDER_ATOMIC];

py.forBlock.ev3_ultrasonic_listen=b=>
  [`ultrasonic_${b.getFieldValue("PORT")}.presence()`,py.ORDER_ATOMIC];

py.forBlock.ev3_gyro_angle=b=>
  [`gyro_${b.getFieldValue("PORT")}.angle()`,py.ORDER_ATOMIC];

py.forBlock.ev3_gyro_rate=b=>
  [`gyro_${b.getFieldValue("PORT")}.speed()`,py.ORDER_ATOMIC];

py.forBlock.ev3_timer_value=b=>
  [`timer.time()/1000`,py.ORDER_ATOMIC];

py.forBlock.ev3_button_value=b=>
  [`Button.${b.getFieldValue("BUTTON")} in ev3.buttons.pressed()`,py.ORDER_ATOMIC];

py.forBlock.ev3_touch_wait=b=>
  `while not touch_${b.getFieldValue("PORT")}.pressed():\n    wait(10)\n`;

py.forBlock.ev3_color_wait=b=>
  `while color_sensor_${b.getFieldValue("PORT")}.color() != Color.${b.getFieldValue("COLOR")}:\n    wait(10)\n`;

py.forBlock.ev3_distance_wait=b=>
  `while ultrasonic_${b.getFieldValue("PORT")}.distance() >= ${Number(b.getFieldValue("CM"))}:\n    wait(10)\n`;

py.forBlock.ev3_gyro_wait=b=>
  `while abs(gyro_${b.getFieldValue("PORT")}.angle()) < abs(${Number(b.getFieldValue("ANGLE"))}):\n    wait(10)\n`;

py.forBlock.ev3_button_wait=b=>
  `while Button.${b.getFieldValue("BUTTON")} not in ev3.buttons.pressed():\n    wait(10)\n`;

for(const n of [
  "ev3_event_touch","ev3_event_color","ev3_event_distance",
  "ev3_event_gyro","ev3_event_button","ev3_event_timer",
  "ev3_event_message"
]){
  py.forBlock[n]=b=>py.statementToCode(b,"DO");
}

py.forBlock.ev3_led=b=>
  `ev3.light.on(Color.${b.getFieldValue("COLOR")})\n`;

py.forBlock.ev3_button_wait_release=b=>
  `while Button.${b.getFieldValue("BUTTON")} in ev3.buttons.pressed():\n    wait(10)\n`;

py.forBlock.ev3_reset_timer=b=>
  `timer.reset()\n`;

py.forBlock.ev3_comment=b=>
  `# ${b.getFieldValue("TEXT")}\n`;

/* =========================================================
   GERAÇÃO DO PROGRAMA
   ========================================================= */

function portsFor(types,field){
  const s=new Set();
  workspace.getAllBlocks(false).forEach(b=>{
    if(types.includes(b.type)){
      const p=b.getFieldValue(field);
      if(p) s.add(p);
    }
  });
  return [...s];
}

function generate(){
  const body=py.workspaceToCode(workspace);

  const motorTypes=[
    "ev3_motor_time","ev3_motor_angle","ev3_motor_forever",
    "ev3_motor_speed","ev3_motor_stop","ev3_motor_reset",
    "ev3_motor_get_angle","ev3_motor_get_speed",
    "ev3_motor_get_load","ev3_motor_hold"
  ];

  const mp=portsFor(motorTypes,"PORT")
    .filter(p=>p!=="ALL");

  const tp=portsFor([
    "ev3_touch_wait","ev3_touch_value","ev3_event_touch"
  ],"PORT");

  const cp=portsFor([
    "ev3_color_wait","ev3_color_value","ev3_reflected_value",
    "ev3_ambient_value","ev3_event_color"
  ],"PORT");

  const up=portsFor([
    "ev3_distance_wait","ev3_ultrasonic_value",
    "ev3_ultrasonic_listen","ev3_event_distance"
  ],"PORT");

  const gp=portsFor([
    "ev3_gyro_wait","ev3_gyro_angle",
    "ev3_gyro_rate","ev3_event_gyro"
  ],"PORT");

  const dp=[
    ...portsFor(["ev3_drive_distance","ev3_drive_turn"],"LEFT"),
    ...portsFor(["ev3_drive_distance","ev3_drive_turn"],"RIGHT")
  ].filter(Boolean);

  const timerUsed=workspace.getAllBlocks(false)
    .some(b=>b.type==="ev3_timer_value" || b.type==="ev3_reset_timer");

  let h=
`from pybricks.hubs import EV3Brick
from pybricks.ev3devices import Motor, TouchSensor, ColorSensor, UltrasonicSensor, GyroSensor
from pybricks.parameters import Port, Color, Button
from pybricks.tools import wait, StopWatch

ev3 = EV3Brick()
`;

  if(mp.length){
    h+=mp.map(p=>`motor_${p.toLowerCase()} = Motor(Port.${p})`).join("\n")+"\n";
    h+=`motors = {${mp.map(p=>`"${p}": motor_${p.toLowerCase()}`).join(", ")}}\n`;
  }else{
    h+="motors = {}\n";
  }

  if(dp.length){
    h+=`drive_left = motor_${dp[0].toLowerCase()}
drive_right = motor_${(dp[1]||dp[0]).toLowerCase()}
`;
  }

  if(tp.length)
    h+=tp.map(p=>`touch_${p} = TouchSensor(Port.S${p})`).join("\n")+"\n";

  if(cp.length)
    h+=cp.map(p=>`color_sensor_${p} = ColorSensor(Port.S${p})`).join("\n")+"\n";

  if(up.length)
    h+=up.map(p=>`ultrasonic_${p} = UltrasonicSensor(Port.S${p})`).join("\n")+"\n";

  if(gp.length)
    h+=gp.map(p=>`gyro_${p} = GyroSensor(Port.S${p})`).join("\n")+"\n";

  if(timerUsed)
    h+="timer = StopWatch()\n";

  return h+"\n"+(body||"# Adicione blocos ao programa\n");
}

/* =========================================================
   COMUNICAÇÃO COM O APP QT
   ========================================================= */

function sendCodeToApp(){
  if(bridge && bridge.receive_code)
    bridge.receive_code(generate());
}

function sendProjectToApp(){
  if(bridge && bridge.receive_project)
    bridge.receive_project(
      Blockly.Xml.domToText(
        Blockly.Xml.workspaceToDom(workspace)
      ),
      generate()
    );
}

function loadProject(xml){
  workspace.clear();
  Blockly.Xml.domToWorkspace(
    Blockly.utils.xml.textToDom(xml),
    workspace
  );
}

workspace.addChangeListener(()=>{
  if(bridge && bridge.receive_code)
    bridge.receive_code(generate());
});

</script>
